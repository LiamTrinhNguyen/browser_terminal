<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linux Terminal Panel</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .title { font-size: 14px; font-weight: 500; color: #8b949e; }
    .controls button {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      margin-left: 8px;
    }
    .controls button:hover { background: #30363d; }
    .controls button.primary {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }
    .controls button.primary:hover { background: #2ea043; }
    #panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      min-height: 0;
    }
    #terminal-wrapper {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    #terminal {
      width: 100%;
      height: 100%;
      padding: 6px;
    }
    #status {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 12px;
      color: #8b949e;
      background: rgba(22, 27, 34, 0.9);
      padding: 3px 10px;
      border-radius: 12px;
      z-index: 10;
      border: 1px solid #30363d;
    }
    #status.running { color: #3fb950; border-color: #238636; }
    #status.booting { color: #d29922; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <span class="title">Linux Terminal Panel</span>
    </div>
    <div class="controls">
      <button id="btn-boot" class="primary">Boot Linux</button>
      <button id="btn-reset">Reset</button>
    </div>
  </div>

  <div id="panel">
    <div id="terminal-wrapper">
      <div id="status">Ready — click Boot Linux</div>
      <div id="terminal"></div>
    </div>
  </div>

  <script src="libv86.js"></script>
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>

  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      theme: {
        background: '#0d1117',
        foreground: '#c9d1d9',
        cursor: '#58a6ff',
        selectionBackground: '#264f78'
      },
      scrollback: 5000,
      convertEol: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Click anywhere in the terminal to focus it
    document.getElementById('terminal-wrapper').addEventListener('click', () => {
      term.focus();
    });

    let emulator = null;
    const statusEl = document.getElementById('status');
    const btnBoot = document.getElementById('btn-boot');

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type || '';
    }

    function boot() {
      if (emulator) {
        try { emulator.stop(); } catch (e) {}
        emulator = null;
      }

      term.reset();
      term.writeln('Starting emulator...');
      setStatus('Booting... please wait (30-90s)', 'booting');
      btnBoot.disabled = true;
      btnBoot.textContent = 'Booting...';

      // Prefer linux4.iso first (more reliable serial shell)
      // Change to 'alpine.iso' later once basic interaction works
      //const iso = 'linux4.iso';
      const iso = 'alpine.iso'; //for new version of python interaction

      emulator = new V86({
        wasm_path: 'v86.wasm',
        memory_size: 256 * 1024 * 1024,
        vga_memory_size: 2 * 1024 * 1024,
        bios: { url: 'seabios.bin' },
        vga_bios: { url: 'vgabios.bin' },
        cdrom: { url: iso },
        autostart: true,
        disable_keyboard: true,
        disable_mouse: true
      });

      // Listen for BOTH possible serial events (different v86 versions use different names)
      function onSerialData(data) {
        if (typeof data === 'number') {
          term.write(String.fromCharCode(data));
        } else {
          term.write(data);
        }
      }

      emulator.add_listener('serial0-output-byte', onSerialData);
      emulator.add_listener('serial0-output-char', onSerialData);

      // Send keystrokes to the emulator
      term.onData(function (data) {
        if (emulator) {
          emulator.serial0_send(data);
        }
      });

      emulator.add_listener('emulator-loaded', function () {
        setStatus('Emulator loaded — waiting for shell...', 'booting');
        term.writeln('\r\n[emulator loaded]');
      });

      // After some time, assume it is ready
      setTimeout(function () {
        setStatus('Try typing now (click terminal first)', 'running');
        btnBoot.disabled = false;
        btnBoot.textContent = 'Boot Linux';
        term.focus();
        term.writeln('\r\n[ready — click here and type]');
      }, 45000);

      window.addEventListener('resize', () => fitAddon.fit());
    }

    btnBoot.addEventListener('click', boot);

    document.getElementById('btn-reset').addEventListener('click', function () {
      if (emulator) {
        emulator.restart();
        setStatus('Restarting...', 'booting');
        term.reset();
      }
    });
  </script>
</body>
</html>
