<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Terminal (Pyodide)</title>

  <!-- xterm.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red    { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green  { background: #27c93f; }

    .title {
      font-size: 14px;
      font-weight: 500;
      color: #8b949e;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls button, .controls label {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .controls button:hover, .controls label:hover {
      background: #30363d;
    }
    .controls button.primary {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }
    .controls button.primary:hover {
      background: #2ea043;
    }
    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      min-height: 0;
    }

    #terminal-wrapper {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    #terminal {
      width: 100%;
      height: 100%;
      padding: 6px;
    }

    #status {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 12px;
      color: #8b949e;
      background: rgba(22, 27, 34, 0.9);
      padding: 3px 10px;
      border-radius: 12px;
      z-index: 10;
      border: 1px solid #30363d;
    }
    #status.ready {
      color: #3fb950;
      border-color: #238636;
    }
    #status.loading {
      color: #d29922;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <span class="title">Python Terminal · Pyodide</span>
    </div>
    <div class="controls">
      <button id="btn-start" class="primary">Start Python</button>
      <label>
        Load .py file
        <input type="file" id="file-input" accept=".py" style="display:none" />
      </label>
      <button id="btn-clear">Clear</button>
    </div>
  </div>

  <div id="panel">
    <div id="terminal-wrapper">
      <div id="status">Click “Start Python”</div>
      <div id="terminal"></div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

  <script>
    // ========== Terminal ==========
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'Menlo, Monaco, "Cascadia Code", "Courier New", monospace',
      theme: {
        background: '#0d1117',
        foreground: '#c9d1d9',
        cursor: '#58a6ff',
        selectionBackground: '#264f78'
      },
      scrollback: 5000,
      convertEol: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    window.addEventListener('resize', () => fitAddon.fit());

    // Click to focus
    document.getElementById('terminal-wrapper').addEventListener('click', () => term.focus());

    // ========== State ==========
    let pyodide = null;
    let ready = false;
    let currentInput = '';
    let prompt = '>>> ';

    const statusEl = document.getElementById('status');
    const btnStart = document.getElementById('btn-start');

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    function write(text) {
      term.write(text);
    }

    function writeln(text = '') {
      term.writeln(text);
    }

    // ========== Start Pyodide ==========
    async function startPython() {
      if (ready) return;

      btnStart.disabled = true;
      btnStart.textContent = 'Loading...';
      setStatus('Loading Python (first time may take 10-20s)...', 'loading');
      writeln('Loading Pyodide (CPython in WebAssembly)...');
      writeln('Please wait...\r\n');

      try {
        pyodide = await loadPyodide({
          indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'
        });

        // Redirect Python print to the terminal
        pyodide.setStdout({
          batched: (text) => {
            write(text);
          }
        });
        pyodide.setStderr({
          batched: (text) => {
            write('\x1b[31m' + text + '\x1b[0m');
          }
        });

        ready = true;
        setStatus('Python is ready', 'ready');
        btnStart.textContent = 'Python Ready';
        btnStart.disabled = true;

        writeln('Python ' + pyodide.runPython('import sys; sys.version.split()[0]') + ' ready');
        writeln('Type Python code and press Enter. Use Shift+Enter for multi-line.');
        writeln('You can also load a .py file with the button above.\r\n');
        write(prompt);
        term.focus();

      } catch (err) {
        writeln('\x1b[31mFailed to load Python: ' + err.message + '\x1b[0m');
        setStatus('Failed to load', '');
        btnStart.disabled = false;
        btnStart.textContent = 'Start Python';
      }
    }

    // ========== Run Python code ==========
    async function runCode(code) {
      if (!ready || !code.trim()) return;

      try {
        const result = await pyodide.runPythonAsync(code);

        // If the code produced a value, show it
        if (result !== undefined && result !== null) {
          const repr = pyodide.runPython(`repr(${JSON.stringify(String(result))})`);
          // Better: use Python's own repr
          const pyRepr = await pyodide.runPythonAsync(`
import sys
_val = None
try:
    _val = ${code}
except:
    pass
repr(_val) if _val is not None else ""
          `).catch(() => '');

          // Simpler approach - just show non-None results from expressions
        }
      } catch (err) {
        writeln('\x1b[31m' + err.message + '\x1b[0m');
      }
    }

    // Better execution that shows expression results
    async function execute(code) {
      if (!ready) return;

      try {
        // Try to eval as expression first (to show result)
        let result;
        try {
          result = pyodide.runPython(code);
          if (result !== undefined && result !== null) {
            // Convert to string representation
            const str = pyodide.globals.get('repr')(result);
            writeln(str);
          }
        } catch (e) {
          // Not a simple expression → run as statements
          await pyodide.runPythonAsync(code);
        }
      } catch (err) {
        writeln('\x1b[31m' + (err.message || String(err)) + '\x1b[0m');
      }
    }

    // ========== Input handling ==========
    term.onData((data) => {
      if (!ready) return;

      const code = data.charCodeAt(0);

      // Enter
      if (data === '\r') {
        writeln('');
        const line = currentInput;
        currentInput = '';

        if (line.trim()) {
          execute(line).then(() => {
            write(prompt);
          });
        } else {
          write(prompt);
        }
        return;
      }

      // Backspace
      if (data === '\u007F' || data === '\b') {
        if (currentInput.length > 0) {
          currentInput = currentInput.slice(0, -1);
          write('\b \b');
        }
        return;
      }

      // Ctrl+C
      if (code === 3) {
        writeln('^C');
        currentInput = '';
        write(prompt);
        return;
      }

      // Ctrl+L (clear)
      if (code === 12) {
        term.clear();
        write(prompt);
        return;
      }

      // Printable characters
      if (data >= ' ' || data === '\t') {
        currentInput += data;
        write(data);
      }
    });

    // ========== Buttons ==========
    document.getElementById('btn-start').addEventListener('click', startPython);

    document.getElementById('btn-clear').addEventListener('click', () => {
      term.clear();
      currentInput = '';
      if (ready) write(prompt);
    });

    // Load .py file
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !ready) return;

      const text = await file.text();
      writeln('\r\n# Running file: ' + file.name);
      writeln('----------------------------------------');
      await execute(text);
      writeln('----------------------------------------');
      write(prompt);
      e.target.value = ''; // reset so same file can be loaded again
    });

    // Optional: auto-start
    // window.addEventListener('load', () => setTimeout(startPython, 300));
  </script>
</body>
</html>
