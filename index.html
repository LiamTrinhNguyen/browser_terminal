<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Terminal (Pyodide)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .title { font-size: 14px; font-weight: 500; color: #8b949e; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .controls button, .controls label {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .controls button:hover, .controls label:hover { background: #30363d; }
    .controls button.primary {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }
    .controls button.primary:hover { background: #2ea043; }
    .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
    #panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      min-height: 0;
    }
    #terminal-wrapper {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    #terminal { width: 100%; height: 100%; padding: 6px; }
    #status {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 12px;
      color: #8b949e;
      background: rgba(22, 27, 34, 0.9);
      padding: 3px 10px;
      border-radius: 12px;
      z-index: 10;
      border: 1px solid #30363d;
    }
    #status.ready { color: #3fb950; border-color: #238636; }
    #status.loading { color: #d29922; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <span class="title">Python Terminal · Pyodide</span>
    </div>
    <div class="controls">
      <button id="btn-start" class="primary">Start Python</button>
      <label>
        Load .py file
        <input type="file" id="file-input" accept=".py" style="display:none" />
      </label>
      <button id="btn-clear">Clear</button>
    </div>
  </div>

  <div id="panel">
    <div id="terminal-wrapper">
      <div id="status">Click “Start Python”</div>
      <div id="terminal"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'Menlo, Monaco, "Cascadia Code", "Courier New", monospace',
      theme: {
        background: '#0d1117',
        foreground: '#c9d1d9',
        cursor: '#58a6ff',
        selectionBackground: '#264f78'
      },
      scrollback: 8000,
      convertEol: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();
    window.addEventListener('resize', () => fitAddon.fit());
    document.getElementById('terminal-wrapper').addEventListener('click', () => term.focus());

    let pyodide = null;
    let ready = false;
    let currentLine = '';
    let buffer = [];          // multi-line buffer
    let inMultiline = false;

    const statusEl = document.getElementById('status');
    const btnStart = document.getElementById('btn-start');

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    function write(text)  { term.write(text); }
    function writeln(text = '') { term.writeln(text); }

    function showPrompt() {
      write(inMultiline ? '... ' : '>>> ');
    }

    // ========== Start Python ==========
    async function startPython() {
      if (ready) return;

      btnStart.disabled = true;
      btnStart.textContent = 'Loading...';
      setStatus('Loading Python (10-25s first time)...', 'loading');
      writeln('Loading Pyodide (real CPython in WebAssembly)...\r\n');

      try {
        pyodide = await loadPyodide({
          indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'
        });

        // Load micropip so we can install packages
        await pyodide.loadPackage('micropip');
        await pyodide.runPythonAsync('import micropip');

        // Redirect stdout / stderr to terminal
        pyodide.setStdout({ batched: (t) => write(t) });
        pyodide.setStderr({ batched: (t) => write('\x1b[31m' + t + '\x1b[0m') });

        ready = true;
        setStatus('Python ready', 'ready');
        btnStart.textContent = 'Python Ready';

        const ver = pyodide.runPython('import sys; sys.version.split()[0]');
        writeln('Python ' + ver + ' ready (Pyodide)');
        writeln('• Enter          → run code');
        writeln('• Shift+Enter    → multi-line continue');
        writeln('• %pip install x → install package');
        writeln('• Ctrl+C         → cancel current input');
        writeln('• Ctrl+L         → clear screen\r\n');
        showPrompt();
        term.focus();

      } catch (err) {
        writeln('\x1b[31mFailed: ' + err.message + '\x1b[0m');
        setStatus('Failed', '');
        btnStart.disabled = false;
        btnStart.textContent = 'Start Python';
      }
    }

    // ========== Execute code ==========
    async function execute(code) {
      if (!ready || !code.trim()) return;

      // Special command: %pip install ...
      if (code.trim().startsWith('%pip install ') || code.trim().startsWith('!pip install ')) {
        const pkg = code.trim().replace(/^(%|!)pip install\s+/, '').trim();
        if (!pkg) {
          writeln('Usage: %pip install package_name');
          return;
        }
        writeln('Installing ' + pkg + ' ...');
        try {
          await pyodide.runPythonAsync(`
import micropip
await micropip.install("${pkg}")
print("Successfully installed ${pkg}")
          `);
        } catch (e) {
          writeln('\x1b[31m' + (e.message || e) + '\x1b[0m');
        }
        return;
      }

      // Normal Python code
      try {
        // First try as expression (to show the result)
        try {
          const result = pyodide.runPython(code);
          if (result !== undefined && result !== null) {
            const repr = pyodide.globals.get('repr');
            writeln(repr(result));
          }
        } catch (e) {
          // Not a pure expression → run as statements
          await pyodide.runPythonAsync(code);
        }
      } catch (err) {
        writeln('\x1b[31m' + (err.message || String(err)) + '\x1b[0m');
      }
    }

    // ========== Input handling ==========
    term.onData((data) => {
      if (!ready) return;

      const code = data.charCodeAt(0);

      // Enter (run or continue)
      if (data === '\r') {
        writeln('');

        // Shift+Enter is detected by the browser as a different event,
        // but xterm only gives us the character. We use a simple rule:
        // if the line ends with ":" or is empty while in multiline → continue
        // otherwise if user holds Shift we can't easily detect it here,
        // so we provide an alternative: type a lone "\" at the end to continue.

        const line = currentLine;
        currentLine = '';

        // Explicit continue marker: line ends with \
        if (line.endsWith('\\')) {
          buffer.push(line.slice(0, -1));
          inMultiline = true;
          showPrompt();
          return;
        }

        buffer.push(line);

        // Auto multi-line: if line ends with : or we are already in multi-line
        // and the line is not empty, keep collecting
        const last = buffer[buffer.length - 1];
        const shouldContinue =
          inMultiline && last.trim() !== '' ||
          last.trim().endsWith(':') ||
          last.trim().endsWith('\\');

        if (shouldContinue && last.trim() !== '') {
          inMultiline = true;
          showPrompt();
          return;
        }

        // Empty line while in multi-line → finish
        if (inMultiline && last.trim() === '') {
          buffer.pop(); // remove the empty line
        }

        const fullCode = buffer.join('\n');
        buffer = [];
        inMultiline = false;

        if (fullCode.trim()) {
          execute(fullCode).then(() => showPrompt());
        } else {
          showPrompt();
        }
        return;
      }

      // Backspace
      if (data === '\u007F' || data === '\b') {
        if (currentLine.length > 0) {
          currentLine = currentLine.slice(0, -1);
          write('\b \b');
        }
        return;
      }

      // Ctrl+C
      if (code === 3) {
        writeln('^C');
        currentLine = '';
        buffer = [];
        inMultiline = false;
        showPrompt();
        return;
      }

      // Ctrl+L
      if (code === 12) {
        term.clear();
        showPrompt();
        return;
      }

      // Printable
      if (data >= ' ' || data === '\t') {
        currentLine += data;
        write(data);
      }
    });

    // Better multi-line with real Shift+Enter detection
    // We listen at the DOM level for keydown
    term.textarea.addEventListener('keydown', (e) => {
      if (!ready) return;

      if (e.key === 'Enter' && e.shiftKey) {
        e.preventDefault();
        // Force continue
        writeln('');
        buffer.push(currentLine);
        currentLine = '';
        inMultiline = true;
        showPrompt();
      }
    });

    // ========== Buttons ==========
    btnStart.addEventListener('click', startPython);

    document.getElementById('btn-clear').addEventListener('click', () => {
      term.clear();
      currentLine = '';
      buffer = [];
      inMultiline = false;
      if (ready) showPrompt();
    });

    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !ready) return;

      const text = await file.text();
      writeln('\r\n# Running: ' + file.name);
      writeln('----------------------------------------');
      await execute(text);
      writeln('----------------------------------------');
      showPrompt();
      e.target.value = '';
    });
  </script>
</body>
</html>
